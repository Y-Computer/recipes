<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">Y benchmark snapshot: DeepSeek V4 Flash 0731 on one NVIDIA DGX Spark</title>
  <desc id="desc">Y measured 28.29 tokens per second and 9.34 seconds for a fixed 256-token response using its IQ3_M speculative sidecar, compared with 16.93 tokens per second and 15.41 seconds target-only. The Y sidecar is 7.95 GiB and left 9.07 GiB minimum observed memory available.</desc>

  <rect width="1400" height="1060" rx="28" fill="#fbf8f5"/>

  <text x="42" y="54" fill="#6f6b63" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">Y PROOF 001 · EXACT NVIDIA DGX SPARK · 08 AUG 2026</text>
  <text x="42" y="126" fill="#141311" font-family="Georgia, serif" font-size="58" font-weight="700">One Spark. 284.3B parameters.</text>
  <text x="42" y="169" fill="#6f6b63" font-family="Arial, sans-serif" font-size="22">DeepSeek V4 Flash 0731 · same machine · same target · same prompt</text>
  <text x="1316" y="80" fill="#141311" font-family="Georgia, serif" font-size="46" font-weight="700" text-anchor="end">Y</text>

  <rect x="42" y="194" width="785" height="56" rx="10" fill="#141311"/>
  <text x="68" y="231" fill="#ffc671" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0.4">28.29 TOK/S · 1.67× TARGET-ONLY · 39.40% LESS WALL TIME</text>
  <rect x="842" y="194" width="516" height="56" rx="10" fill="#ffc671"/>
  <text x="1100" y="230" fill="#141311" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">RAW EVIDENCE + RECIPE PUBLIC</text>

