<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 Flash 0731 official checkpoint intelligence reference</title>
  <desc id="desc">DeepSeek's official agentic benchmark panel compares V4 Flash 0731 with GLM-5.2 and Claude Opus 4.8. Separate cards show provider-reported Terminal-Bench 2.1 panels from OpenAI, Anthropic and Google. These launch panels use different agent harnesses and are not one leaderboard. The exact Y quantized stack has not yet received a standardized intelligence score.</desc>

